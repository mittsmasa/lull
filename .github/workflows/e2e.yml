name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium --with-deps

      - name: Migrate e2e database
        run: pnpm db:migrate
        env:
          TURSO_DATABASE_URL: file:e2e-local.db

      # NEXT_PUBLIC_VERCEL_ENV はビルド時埋め込み。preview で OAuth エミュレータ
      # 入りのビルドになる（本番デプロイのビルドとは別物である点に注意）
      - name: Build (emulator enabled)
        run: pnpm build
        env:
          NEXT_PUBLIC_VERCEL_ENV: preview
          TURSO_DATABASE_URL: file:e2e-local.db

      # 決済 spec（e2e/payment.spec.ts）を外したため Stripe のキーは渡さない
      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
